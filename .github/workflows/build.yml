name: Build

# Production tag publishing is fail-closed until:
#   1. Repository variable VKEY_STANDARD_RELEASE_ENABLED is exactly "true".
#   2. Environment vkey-standard-release requires reviewers and allows only
#      canonical v* tags that point to the exact Main HEAD.
#   3. VKEY_STANDARD_WINGET_TOKEN is stored only in that environment.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      include_tests:
        # Default true: a tag push always builds the tests, so anything that only
        # breaks them stays invisible across every dispatch and then fails the
        # release. That is exactly what the [[nodiscard]] break in
        # CommitUndoFeatureTest did. Untick this for a deliberately quick build,
        # not as the normal setting.
        description: 'Include tests in the build'
        type: boolean
        default: true
      include_sciter:
        description: 'Include Sciter UI build'
        type: boolean
        default: true
      include_classic:
        description: 'Include Classic UI (Lite) build'
        type: boolean
        default: false
      classic_rust:
        description: 'DEV ONLY: allow Rust in a manual Classic build (never signed or released)'
        type: boolean
        default: false
      include_engine:
        description: 'Include vkey_engine.dll with Sciter artifact output'
        type: boolean
        default: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      source-sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Check public/private file placement
        run: python3 tools/audit/check_public_tree.py

      - name: Validate release tag matches the compiled version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          RELEASE_ENABLED: ${{ vars.VKEY_STANDARD_RELEASE_ENABLED }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_ENABLED" != "true" ]]; then
            echo "Standard production release is locked." >&2
            echo "Set VKEY_STANDARD_RELEASE_ENABLED=true only after protecting vkey-standard-release." >&2
            exit 1
          fi
          version="$(sed -n 's/^project(VKey VERSION \([^ ]*\).*/\1/p' CMakeLists.txt)"
          test -n "$version"
          test "$GITHUB_REF_NAME" = "v$version"
          tag_sha="$(git rev-list -n 1 "refs/tags/$GITHUB_REF_NAME")"
          main_sha="$(git rev-parse refs/remotes/origin/Main)"
          test "$tag_sha" = "$(git rev-parse HEAD)"
          if [[ "$tag_sha" != "$main_sha" ]]; then
            echo "$GITHUB_REF_NAME must point to the exact Main HEAD" >&2
            echo "tag=$tag_sha Main=$main_sha" >&2
            exit 1
          fi

      - name: Validate manual Classic options
        if: github.event_name == 'workflow_dispatch' && inputs.classic_rust && !inputs.include_classic
        shell: bash
        run: |
          echo "classic_rust requires include_classic=true" >&2
          exit 1

      - name: Audit hook-thread Rule #11.3 compliance
        run: bash tools/audit/check_hook_thread_no_mutex.sh

      - name: Check asset provenance
        run: python3 tools/audit/check_asset_provenance.py

      - name: Record immutable source SHA
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Sciter and Classic intentionally use separate build trees and artifacts.
  # Sciter opts into Rust and remains unsigned in v4.3.
  build-sciter:
    needs: validate
    if: startsWith(github.ref, 'refs/tags/') || inputs.include_sciter
    runs-on: windows-2022
    outputs:
      artifact-id: ${{ steps.upload-sciter.outputs.artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      # The engine libraries are no longer committed: they embed CC BY-NC data and
      # are not covered by this repository's GPL-3.0 licence. They are fetched
      # from the exact release named in extern/vkey_engine/engine.release and
      # verified against the committed extern/vkey_engine/engine.lock, which is
      # the trust anchor — not the download.
      - name: Fetch prebuilt engine
        env:
          ENGINE_TOKEN: ${{ secrets.VKEY_ENGINE_TOKEN }}
        shell: bash
        run: |
          if [ -z "${ENGINE_TOKEN}" ]; then
            echo "VKEY_ENGINE_TOKEN is unset or empty." >&2
            echo "The engine release lives in a private repository, so the fetch needs a token." >&2
            echo "Set the secret, or build without the engine: -DVKEY_USE_RUST_ENGINE=OFF." >&2
            exit 1
          fi
          python tools/fetch_engine.py \
            --lock extern/vkey_engine/engine.lock \
            --dest "${{ github.workspace }}/build-engine" \
            --repo phatMT97/VKey-rs \
            --tag "$(tr -d '[:space:]' < extern/vkey_engine/engine.release)" \
            --token "${ENGINE_TOKEN}"

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DVKEY_USE_RUST_ENGINE=ON -DVKEY_ENGINE_ROOT="${{ github.workspace }}/build-engine"

      - name: Build VKey
        run: cmake --build build --config Release --target VKeyApp

      - name: Build TSF DLL
        run: cmake --build build --config Release --target VKeyTSF

      - name: Build Watchdog
        run: cmake --build build --config Release --target VKeyWatchdog

      - name: Build browser host
        run: cmake --build build --config Release --target VKeyBrowserHost

      - name: Build tests
        if: github.event_name != 'workflow_dispatch' || inputs.include_tests
        # VKeyTestRunner lives in the optional private internal submodule.
        # Public CI checkouts omit it; maintainer checkouts build it when present.
        shell: bash
        run: |
          cmake --build build --config Release --target VKeyTests
          if [ -f internal/tools/VKeyTestRunner/CMakeLists.txt ]; then
            cmake --build build --config Release --target VKeyTestRunnerTests
          fi

      - name: Run tests
        if: github.event_name != 'workflow_dispatch' || inputs.include_tests
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Reject a same-name tampered engine
        if: github.event_name != 'workflow_dispatch' || inputs.include_tests
        shell: powershell
        run: |
          $engine = "build/tests/Release/vkey_engine.dll"
          $bytes = [System.IO.File]::ReadAllBytes($engine)
          $bytes[$bytes.Length - 1] = $bytes[$bytes.Length - 1] -bxor 1
          [System.IO.File]::WriteAllBytes($engine, $bytes)

          $output = & "build/tests/Release/VKeyTests.exe" `
            --gtest_filter=RustInputEngineTrustTest.VendoredLibraryPassesTrustChecks 2>&1
          if ($LASTEXITCODE -eq 0) {
            throw "tampered vkey_engine.dll was accepted"
          }
          # Release verifies the detached signature, so a flipped byte now fails as
          # a bad signature rather than a bad hash. "is missing or unreadable" here
          # means the pinned engine release predates signing — cut a new one.
          if (($output -join "`n") -notmatch "was not produced by the VKey engine key") {
            $output | Write-Output
            throw "engine rejection did not report the expected trust failure"
          }

          & "build/tests/Release/VKeyTests.exe" `
            --gtest_filter=EngineFactoryTest.AdvancedConfigKeepsTypingAvailable
          if ($LASTEXITCODE -ne 0) {
            throw "C++ fallback failed after rejecting the tampered engine"
          }

      - name: Gather unsigned Sciter binaries
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path unsigned-sciter-binaries
          Copy-Item "build/Release/VKey.exe" "unsigned-sciter-binaries/" -Force
          Copy-Item "build/Release/VKeyTSF.dll" "unsigned-sciter-binaries/" -Force
          Copy-Item "build/Release/VKeyWatchdog.exe" "unsigned-sciter-binaries/" -Force
          Copy-Item "build/Release/VKeyBrowserHost.exe" "unsigned-sciter-binaries/" -Force
          Copy-Item "extern/sciter/bin/sciter.dll" "unsigned-sciter-binaries/" -Force

      - name: Upload unsigned Sciter binaries
        id: upload-sciter
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-sciter-binaries
          path: unsigned-sciter-binaries/
          retention-days: 7

  # Manual Classic builds remain available for unsigned development checks.
  # Official Foundation review/signing uses the isolated
  # vkeyclassic-foundation-signing.yml workflow instead; tag releases must not
  # obtain Classic binaries from this mixed workflow.
  build-classic:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.include_classic
    runs-on: windows-2022
    outputs:
      artifact-id: ${{ steps.upload-classic.outputs.artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      - name: Fetch prebuilt engine for Classic development variant
        if: github.event_name == 'workflow_dispatch' && inputs.classic_rust
        env:
          ENGINE_TOKEN: ${{ secrets.VKEY_ENGINE_TOKEN }}
        shell: bash
        run: |
          if [ -z "${ENGINE_TOKEN}" ]; then
            echo "VKEY_ENGINE_TOKEN is required for the Classic + Rust development variant." >&2
            exit 1
          fi
          python tools/fetch_engine.py \
            --lock extern/vkey_engine/engine.lock \
            --dest "${{ github.workspace }}/build-engine" \
            --repo phatMT97/VKey-rs \
            --tag "$(tr -d '[:space:]' < extern/vkey_engine/engine.release)" \
            --token "${ENGINE_TOKEN}"

      - name: Configure Classic UI (C++ engine only)
        if: github.event_name != 'workflow_dispatch' || !inputs.classic_rust
        run: cmake -B build-classic -G "Visual Studio 17 2022" -A x64 -DVKEY_LITE_MODE=ON -DVKEY_USE_RUST_ENGINE=OFF

      - name: Configure Classic + Rust development variant
        if: github.event_name == 'workflow_dispatch' && inputs.classic_rust
        run: cmake -B build-classic -G "Visual Studio 17 2022" -A x64 -DVKEY_LITE_MODE=ON -DVKEY_USE_RUST_ENGINE=ON -DVKEY_CLASSIC_ALLOW_RUST_ENGINE_FOR_DEV=ON -DVKEY_ENGINE_ROOT="${{ github.workspace }}/build-engine"

      - name: Build Classic UI and its edition-specific TSF DLL
        run: |
          cmake --build build-classic --config Release --target VKeyLite
          cmake --build build-classic --config Release --target VKeyTSF
          cmake --build build-classic --config Release --target VKeyWatchdog
          cmake --build build-classic --config Release --target VKeyBrowserHost

      - name: Build Classic tests
        if: github.event_name != 'workflow_dispatch' || inputs.include_tests
        shell: bash
        run: |
          cmake --build build-classic --config Release --target VKeyTests
          if [ -f internal/tools/VKeyTestRunner/CMakeLists.txt ]; then
            cmake --build build-classic --config Release --target VKeyTestRunnerTests
          fi

      - name: Run Classic tests
        if: github.event_name != 'workflow_dispatch' || inputs.include_tests
        run: ctest --test-dir build-classic --build-config Release --output-on-failure

      - name: Assert Classic build has no Rust engine artifact
        if: github.event_name != 'workflow_dispatch' || !inputs.classic_rust
        shell: powershell
        run: |
          $forbidden = Get-ChildItem "build-classic/Release" -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -in @("vkey_engine.dll", "vkey_engine.dll.sig", "vkey_engine.LICENSE.txt") }
          if ($forbidden) {
            $forbidden.FullName | Write-Output
            throw "official Classic build contains a Rust engine artifact"
          }

      - name: Assert Classic development build has the Rust engine artifact
        if: github.event_name == 'workflow_dispatch' && inputs.classic_rust
        shell: powershell
        run: |
          foreach ($path in @(
            "build-engine/lib/win-x64/vkey_engine.dll",
            "build-engine/lib/win-x64/vkey_engine.dll.sig"
          )) {
            if (-not (Test-Path $path)) {
              throw "Classic + Rust development build is missing $path"
            }
          }

      - name: Gather unsigned Classic binaries
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path unsigned-classic-binaries
          Copy-Item "build-classic/Release/VKeyClassic.exe" "unsigned-classic-binaries/" -Force
          Copy-Item "build-classic/Release/VKeyTSF.dll" "unsigned-classic-binaries/" -Force
          Copy-Item "build-classic/Release/VKeyWatchdog.exe" "unsigned-classic-binaries/" -Force
          Copy-Item "build-classic/Release/VKeyBrowserHost.exe" "unsigned-classic-binaries/" -Force
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.classic_rust }}" -eq "true") {
            Copy-Item "build-engine/lib/win-x64/vkey_engine.dll" "unsigned-classic-binaries/" -Force
            Copy-Item "build-engine/lib/win-x64/vkey_engine.dll.sig" "unsigned-classic-binaries/" -Force
            Copy-Item "extern/vkey_engine/LICENSE" "unsigned-classic-binaries/vkey_engine.LICENSE.txt" -Force
          }

      - name: Upload unsigned Classic binaries
        id: upload-classic
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-classic-binaries
          path: unsigned-classic-binaries/
          retention-days: 7

  package:
    name: Package without release-write permission
    needs: [validate, build-sciter, build-classic]
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      (needs.build-sciter.result == 'success' || needs.build-classic.result == 'success') &&
      (needs.build-sciter.result == 'success' || needs.build-sciter.result == 'skipped') &&
      (needs.build-classic.result == 'success' || needs.build-classic.result == 'skipped')
    runs-on: windows-2022
    outputs:
      release-assets-artifact-id: ${{ steps.upload-release-assets.outputs.artifact-id }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download unsigned Sciter binaries
        if: needs.build-sciter.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned-sciter-binaries
          path: sciter-binaries

      # Foundation signing is deliberately unavailable in this mixed workflow.
      # Only vkeyclassic-foundation-signing.yml may submit the isolated three-file
      # artifact after configuring VKEY_FOUNDATION_BUILD=ON.
      - name: Download unsigned Classic binaries
        if: needs.build-classic.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned-classic-binaries
          path: classic-binaries

      - name: Reconstruct artifact layout
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path upload-payload
          
          if ("${{ needs.build-sciter.result }}" -eq "success") {
            New-Item -ItemType Directory -Force -Path dist
            Copy-Item "sciter-binaries/VKey.exe" "dist/" -Force
            Copy-Item "sciter-binaries/VKeyTSF.dll" "dist/" -Force
            Copy-Item "sciter-binaries/sciter.dll" "dist/" -Force
            # Required: Sciter.JS is BSD 3-Clause, whose clause 2 makes the
            # notice a condition of binary redistribution. It has to be inside
            # the archive, not only in the source repo.
            Copy-Item "THIRD_PARTY_NOTICES.txt" "dist/" -Force

            # Extensions are staged outside the zip archive
            Copy-Item "sciter-binaries/VKeyWatchdog.exe" "." -Force
            Copy-Item "sciter-binaries/VKeyBrowserHost.exe" "." -Force

            if ("${{ startsWith(github.ref, 'refs/tags/') }}" -eq "true" -or "${{ needs.build-classic.result }}" -eq "success") {
              New-Item -ItemType Directory -Force -Path upload-payload/sciter
              Copy-Item "dist/*" "upload-payload/sciter/" -Force
              Copy-Item "VKeyWatchdog.exe" "upload-payload/sciter/" -Force
              Copy-Item "VKeyBrowserHost.exe" "upload-payload/sciter/" -Force
            }
            else {
              Copy-Item "dist/*" "upload-payload/" -Force
              Copy-Item "VKeyWatchdog.exe" "upload-payload/" -Force
              Copy-Item "VKeyBrowserHost.exe" "upload-payload/" -Force
            }
          }
          
          if ("${{ needs.build-classic.result }}" -eq "success") {
            New-Item -ItemType Directory -Force -Path dist-classic
            Copy-Item "classic-binaries/VKeyClassic.exe" "dist-classic/" -Force
            # VKeyTSF.dll is REQUIRED — RegisterTsf() does LoadLibrary("<exe-dir>\VKeyTSF.dll").
            # Without it the Classic build cannot register TSF even when run elevated (issue #199).
            # This TSF DLL comes from the Rust-OFF Classic tree; never reuse the
            # same-named Rust-enabled DLL produced by the Sciter job.
            Copy-Item "classic-binaries/VKeyTSF.dll" "dist-classic/" -Force
            Copy-Item "THIRD_PARTY_NOTICES.txt" "dist-classic/" -Force
            if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.classic_rust }}" -eq "true") {
              Copy-Item "classic-binaries/vkey_engine.dll" "dist-classic/" -Force
              Copy-Item "classic-binaries/vkey_engine.dll.sig" "dist-classic/" -Force
              Copy-Item "classic-binaries/vkey_engine.LICENSE.txt" "dist-classic/" -Force
            }
            # Classic reaches this workflow only through workflow_dispatch.
            # It is always an unsigned test artifact and never a release input.
            if ("${{ needs.build-sciter.result }}" -ne "success") {
              Copy-Item "dist-classic/*" "upload-payload/" -Force
              Copy-Item "classic-binaries/VKeyWatchdog.exe" "upload-payload/" -Force
              Copy-Item "classic-binaries/VKeyBrowserHost.exe" "upload-payload/" -Force
            }
            else {
              New-Item -ItemType Directory -Force -Path upload-payload/classic
              Copy-Item "dist-classic/*" "upload-payload/classic/" -Force
              Copy-Item "classic-binaries/VKeyWatchdog.exe" "upload-payload/classic/" -Force
              Copy-Item "classic-binaries/VKeyBrowserHost.exe" "upload-payload/classic/" -Force
            }
          }

      - name: Assert combined workflow remains unsigned
        shell: powershell
        run: |
          if ("${{ needs.build-sciter.result }}" -eq "success") {
            foreach ($path in @("dist/VKey.exe", "dist/VKeyTSF.dll", "VKeyWatchdog.exe", "VKeyBrowserHost.exe")) {
              $signature = Get-AuthenticodeSignature $path
              if ($signature.Status -ne "NotSigned") {
                throw "Sciter-owned binary must remain unsigned: $path ($($signature.Status))"
              }
            }
          }

          if ("${{ needs.build-classic.result }}" -eq "success") {
            foreach ($path in @("dist-classic/VKeyClassic.exe", "dist-classic/VKeyTSF.dll", "dist-classic/VKeyWatchdog.exe", "dist-classic/VKeyBrowserHost.exe")) {
              $signature = Get-AuthenticodeSignature $path
              if ($signature.Status -ne "NotSigned") {
                throw "combined workflow must not carry a Foundation signature: $path"
              }
            }
          }

      # The engine libraries are no longer committed: they embed CC BY-NC data and
      # are not covered by this repository's GPL-3.0 licence. They are fetched
      # from the exact release named in extern/vkey_engine/engine.release and
      # verified against the committed extern/vkey_engine/engine.lock, which is
      # the trust anchor — not the download.
      - name: Fetch prebuilt engine
        if: needs.build-sciter.result == 'success' && (startsWith(github.ref, 'refs/tags/') || inputs.include_engine)
        env:
          ENGINE_TOKEN: ${{ secrets.VKEY_ENGINE_TOKEN }}
        shell: bash
        run: |
          if [ -z "${ENGINE_TOKEN}" ]; then
            echo "VKEY_ENGINE_TOKEN is unset or empty." >&2
            echo "The engine release lives in a private repository, so the fetch needs a token." >&2
            echo "Set the secret, or build without the engine: -DVKEY_USE_RUST_ENGINE=OFF." >&2
            exit 1
          fi
          python tools/fetch_engine.py \
            --lock extern/vkey_engine/engine.lock \
            --dest "${{ github.workspace }}/build-engine" \
            --repo phatMT97/VKey-rs \
            --tag "$(tr -d '[:space:]' < extern/vkey_engine/engine.release)" \
            --token "${ENGINE_TOKEN}"

      - name: Stage external engine asset
        if: needs.build-sciter.result == 'success' && (startsWith(github.ref, 'refs/tags/') || inputs.include_engine)
        shell: powershell
        run: |
          Copy-Item "${{ github.workspace }}/build-engine/lib/win-x64/vkey_engine.dll" "vkey_engine.dll" -Force
          # Release builds verify this signature instead of the lock hash, so the
          # engine without it is unloadable. Fail here rather than ship half of it.
          $sig = "${{ github.workspace }}/build-engine/lib/win-x64/vkey_engine.dll.sig"
          if (-not (Test-Path $sig)) {
            # ASCII only inside a PowerShell string: `shell: powershell` is 5.1 and
            # reads the generated .ps1 as ANSI, so an em dash decodes to a smart
            # quote that closes the string and breaks the parser.
            throw "vkey_engine.dll.sig is missing - the pinned engine release predates signing"
          }
          Copy-Item $sig "vkey_engine.dll.sig" -Force
          # The engine is not covered by this repository's GPL-3.0 license and
          # embeds CC BY-NC data, so its license text has to travel with the
          # binary wherever the binary goes — as a sibling release asset for a
          # tag, and inside the payload for a workflow_dispatch test build.
          Copy-Item "extern/vkey_engine/LICENSE" "vkey_engine.LICENSE.txt" -Force
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.include_engine }}" -eq "true") {
            Copy-Item "${{ github.workspace }}/build-engine/lib/win-x64/vkey_engine.dll" "upload-payload/vkey_engine.dll" -Force
            Copy-Item $sig "upload-payload/vkey_engine.dll.sig" -Force
            Copy-Item "extern/vkey_engine/LICENSE" "upload-payload/vkey_engine.LICENSE.txt" -Force
          }

      - name: Assert engine remains outside app packages
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        run: |
          $forbidden = @(
            "classic-binaries/vkey_engine.dll",
            "classic-binaries/vkey_engine.dll.sig",
            "dist/vkey_engine.dll",
            "dist-classic/vkey_engine.dll",
            "dist/vkey_engine.dll.sig",
            "dist-classic/vkey_engine.dll.sig"
          )
          foreach ($path in $forbidden) {
            if (Test-Path $path) {
              throw "external engine entered app packaging: $path"
            }
          }
          if (-not (Test-Path "vkey_engine.dll")) {
            throw "external engine release asset is missing"
          }
          if (-not (Test-Path "vkey_engine.dll.sig")) {
            throw "external engine signature is missing next to the release asset"
          }
          # The engine is noncommercial-only and embeds CC BY-NC data. Shipping it
          # without its license text is the failure this assertion exists to stop.
          if (-not (Test-Path "vkey_engine.LICENSE.txt")) {
            throw "external engine license is missing next to the release asset"
          }

      # Last gate before anything is archived: the payload is exactly what a
      # licensing scanner downloads and inspects, so check it rather than trusting
      # that the tracked-file gate covered everything that reached it.
      - name: Check release payload for unlicensed assets
        shell: bash
        run: python3 tools/audit/check_asset_provenance.py --dir upload-payload

      # --- Zip releases ---
      - name: Zip Release
        if: startsWith(github.ref, 'refs/tags/') && needs.build-sciter.result == 'success'
        shell: powershell
        run: |
          $expected = @(
            "THIRD_PARTY_NOTICES.txt",
            "VKey.exe",
            "VKeyTSF.dll",
            "sciter.dll"
          ) | Sort-Object
          $actual = @(
            Get-ChildItem "dist" -File |
              Select-Object -ExpandProperty Name |
              Sort-Object
          )
          $directories = @(Get-ChildItem "dist" -Directory -Recurse)
          if ($directories.Count -ne 0 -or (Compare-Object $expected $actual)) {
            $directories.FullName | Write-Output
            $actual | Write-Output
            throw "Sciter release package differs from the four-file allowlist"
          }
          Compress-Archive -Path "dist/*" -DestinationPath VKey.zip
          Copy-Item VKey.zip VKey-x64.zip -Force

      # --- SHA-256 checksums ---
      - name: Generate SHA-256 checksums
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        run: |
          # Generate SHA-256 sidecars used by VerifyDownloadedZip (SEC-001)
          # Format: "<hash>  <filename>" (GNU coreutils sha256sum compatible)
          $files = @()
          if ("${{ needs.build-sciter.result }}" -eq "success") {
            $files += "VKey.zip"
            $files += "VKey-x64.zip"
            $files += "VKeyBrowserHost.exe"
            $files += "VKeyWatchdog.exe"
          }
          $files += "vkey_engine.dll"
          $files += "vkey_engine.dll.sig"
          foreach ($file in $files) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            "$hash  $file" | Out-File -Encoding ascii "$file.sha256"
          }

      - name: Upload immutable standard-release assets
        id: upload-release-assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: standard-release-assets-${{ github.ref_name }}
          path: |
            RELEASE_NOTES.md
            VKey.zip
            VKey.zip.sha256
            VKey-x64.zip
            VKey-x64.zip.sha256
            VKeyBrowserHost.exe
            VKeyBrowserHost.exe.sha256
            VKeyWatchdog.exe
            VKeyWatchdog.exe.sha256
            vkey_engine.dll
            vkey_engine.dll.sha256
            vkey_engine.dll.sig
            vkey_engine.dll.sig.sha256
            vkey_engine.LICENSE.txt
          if-no-files-found: error
          retention-days: 30

      - name: Select final artifact name
        id: artifact-name
        shell: bash
        run: |
          has_sciter="${{ needs.build-sciter.result == 'success' }}"
          has_classic="${{ needs.build-classic.result == 'success' }}"
          has_classic_rust="${{ inputs.classic_rust }}"

          if [[ "$has_sciter" == "true" && "$has_classic" == "true" ]]; then
            if [[ "$has_classic_rust" == "true" ]]; then
              name="VKey-Sciter-Classic-Rust-DEV-x64"
            else
              name="VKey-Sciter-Classic-x64"
            fi
          elif [[ "$has_sciter" == "true" ]]; then
            name="VKey-Sciter-x64"
          elif [[ "$has_classic_rust" == "true" ]]; then
            name="VKey-Classic-Rust-DEV-x64"
          else
            name="VKey-Classic-x64"
          fi

          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Upload final artifact
        id: upload-final
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          path: upload-payload/


  publish-release:
    name: Attest and publish exact standard-release assets
    if: startsWith(github.ref, 'refs/tags/')
    needs: [validate, build-sciter, package]
    runs-on: windows-2022
    environment:
      name: vkey-standard-release
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Checkout validated release source without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.source-sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          submodules: false

      - name: Revalidate tag and Main after environment approval
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.validate.outputs.source-sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag_sha="$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")"
          source_sha="$(git rev-parse HEAD)"
          main_sha="$(git rev-parse refs/remotes/origin/Main)"
          if [[ "$tag_sha" != "$EXPECTED_SHA" || "$source_sha" != "$EXPECTED_SHA" || "$main_sha" != "$EXPECTED_SHA" ]]; then
            echo "release tag, validated source, or Main changed while waiting for approval" >&2
            echo "tag=$tag_sha source=$source_sha Main=$main_sha expected=$EXPECTED_SHA" >&2
            exit 1
          fi

      - name: Download exact release-assets artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.package.outputs.release-assets-artifact-id }}
          path: ${{ runner.temp }}/release-assets

      - name: Verify immutable release assets and archive contents
        shell: powershell
        run: |
          $root = Join-Path $env:RUNNER_TEMP "release-assets"
          $expected = @(
            "RELEASE_NOTES.md",
            "VKey.zip",
            "VKey.zip.sha256",
            "VKey-x64.zip",
            "VKey-x64.zip.sha256",
            "VKeyBrowserHost.exe",
            "VKeyBrowserHost.exe.sha256",
            "VKeyWatchdog.exe",
            "VKeyWatchdog.exe.sha256",
            "vkey_engine.dll",
            "vkey_engine.dll.sha256",
            "vkey_engine.dll.sig",
            "vkey_engine.dll.sig.sha256",
            "vkey_engine.LICENSE.txt"
          ) | Sort-Object
          $actual = @(
            Get-ChildItem $root -File |
              Select-Object -ExpandProperty Name |
              Sort-Object
          )
          $directories = @(Get-ChildItem $root -Directory -Recurse)
          if ($directories.Count -ne 0 -or (Compare-Object $expected $actual)) {
            $directories.FullName | Write-Output
            $actual | Write-Output
            throw "Standard release artifact differs from the fourteen-file allowlist"
          }

          foreach ($name in @(
            "VKey.zip",
            "VKey-x64.zip",
            "VKeyBrowserHost.exe",
            "VKeyWatchdog.exe",
            "vkey_engine.dll",
            "vkey_engine.dll.sig"
          )) {
            $path = Join-Path $root $name
            $line = (Get-Content "$path.sha256" -Raw).Trim()
            $pattern = "^([0-9a-f]{64})  $([regex]::Escape($name))$"
            if ($line -notmatch $pattern) {
              throw "Malformed SHA-256 sidecar for $name"
            }
            $hash = (Get-FileHash $path -Algorithm SHA256).Hash.ToLower()
            if ($hash -ne $Matches[1]) {
              throw "SHA-256 sidecar does not match $name"
            }
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $expectedEntries = @(
            "THIRD_PARTY_NOTICES.txt",
            "VKey.exe",
            "VKeyTSF.dll",
            "sciter.dll"
          ) | Sort-Object
          foreach ($archiveName in @("VKey.zip", "VKey-x64.zip")) {
            $archive = [System.IO.Compression.ZipFile]::OpenRead((Join-Path $root $archiveName))
            try {
              $entries = @(
                $archive.Entries |
                  Where-Object { -not [string]::IsNullOrEmpty($_.Name) } |
                  ForEach-Object { $_.FullName.Replace("\", "/") } |
                  Sort-Object
              )
              if (Compare-Object $expectedEntries $entries) {
                $entries | Write-Output
                throw "$archiveName differs from the four-file package allowlist"
              }
            }
            finally {
              $archive.Dispose()
            }
          }

      - name: Attest VKey archives
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/release-assets/VKey.zip
            ${{ runner.temp }}/release-assets/VKey-x64.zip

      - name: Attest external engine and detached signature
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/release-assets/vkey_engine.dll
            ${{ runner.temp }}/release-assets/vkey_engine.dll.sig

      - name: Publish without overwriting release assets
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $root = Join-Path $env:RUNNER_TEMP "release-assets"
          $releaseJson = & gh release view $env:RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --json tagName,isDraft 2>$null
          $releaseExists = $LASTEXITCODE -eq 0
          $releaseWasDraft = $false
          if ($releaseExists) {
            $release = $releaseJson | ConvertFrom-Json
            if ($release.tagName -ne $env:RELEASE_TAG) {
              throw "Existing release does not match $env:RELEASE_TAG"
            }
            $releaseWasDraft = [bool]$release.isDraft
          }
          else {
            & gh release create $env:RELEASE_TAG `
              --repo $env:GITHUB_REPOSITORY `
              --verify-tag `
              --draft `
              --title $env:RELEASE_TAG `
              --notes-file (Join-Path $root "RELEASE_NOTES.md")
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to create the draft release for $env:RELEASE_TAG"
            }
            $releaseWasDraft = $true
          }

          $remoteAssets = @(
            & gh release view $env:RELEASE_TAG `
              --repo $env:GITHUB_REPOSITORY `
              --json assets `
              --jq '.assets[].name'
          )
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to inspect existing release assets"
          }

          # Preflight every same-name asset before changing the Release. Reruns
          # are idempotent only when existing bytes are identical.
          $assets = @(
            "VKey.zip.sha256",
            "VKey-x64.zip.sha256",
            "vkey_engine.dll.sha256",
            "vkey_engine.dll.sig.sha256",
            "vkey_engine.dll.sig",
            "vkey_engine.LICENSE.txt",
            "VKey.zip",
            "VKey-x64.zip",
            "vkey_engine.dll"
          )
          $missingAssets = @()
          foreach ($asset in $assets) {
            $localPath = Join-Path $root $asset
            if ($remoteAssets -contains $asset) {
              $downloadDir = Join-Path $env:RUNNER_TEMP "existing-$asset"
              New-Item -ItemType Directory -Force -Path $downloadDir | Out-Null
              & gh release download $env:RELEASE_TAG `
                --repo $env:GITHUB_REPOSITORY `
                --pattern $asset `
                --dir $downloadDir
              if ($LASTEXITCODE -ne 0) {
                throw "Unable to download existing release asset: $asset"
              }
              $remotePath = Join-Path $downloadDir $asset
              $localHash = (Get-FileHash $localPath -Algorithm SHA256).Hash
              $remoteHash = (Get-FileHash $remotePath -Algorithm SHA256).Hash
              if ($localHash -ne $remoteHash) {
                throw "Refusing to overwrite different existing release asset: $asset"
              }
              Write-Host "Existing $asset is byte-identical; keeping it."
            }
            else {
              $missingAssets += $asset
            }
          }

          # Verification material precedes executable/archive payloads. If the
          # network fails, rerunning fills the missing set without overwrites.
          foreach ($asset in $missingAssets) {
            & gh release upload $env:RELEASE_TAG (Join-Path $root $asset) `
              --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to upload release asset without overwrite: $asset"
            }
          }

          if ($releaseWasDraft) {
            & gh release edit $env:RELEASE_TAG `
              --repo $env:GITHUB_REPOSITORY `
              --draft=false
            if ($LASTEXITCODE -ne 0) {
              throw "Assets are complete but the release could not be published"
            }
          }

  submit-sciter-winget:
    name: Submit standard release to WinGet
    if: startsWith(github.ref, 'refs/tags/')
    needs: publish-release
    runs-on: windows-2022
    environment:
      name: vkey-standard-release
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    permissions:
      contents: read
    steps:
      # winget-releaser only updates an existing package. PhatMT97.VKey must
      # already be seeded as zip + NestedInstaller in microsoft/winget-pkgs.
      - name: Submit VKey (Sciter) to WinGet
        uses: vedantmgoyal9/winget-releaser@4ffc7888bffd451b357355dc214d43bb9f23917e # v2
        with:
          identifier: PhatMT97.VKey
          installers-regex: '^VKey-x64\.zip$'
          token: ${{ secrets.VKEY_STANDARD_WINGET_TOKEN }}
