name: "CLA Assistant"
on:
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: ".github/signatures/cla.json"
          path-to-document: "https://github.com/phatMT97/VKey/blob/Main/.github/CLA.md"
          branch: "Main"
          allowlist: "phatMT97,dependabot[bot],*[bot]"
